[workspace]
members = ["python"]
# A bare `cargo build`/`test` at the root builds only the bridge — the python
# crate is a PyO3 extension (needs python headers) and is built via maturin, not
# cargo. `python` stays a member purely to inherit [workspace.package].version.
# The Dockerfile relies on this: it builds the workspace but must not try to
# compile the extension (it copies python/ only so the workspace manifest loads).
default-members = ["."]

# Single source of truth for the version, inherited by both the bridge crate
# and the pyrustuyabridge wheel via `version.workspace = true`. The PyPI
# package follows automatically (pyproject `dynamic = ["version"]` → maturin).
[workspace.package]
# `-dev` while the 0.4 line is unreleasable: it depends on `rustuya-tokio` from
# git (the 0.4 crates aren't published yet), so there is nothing to tag. Mirrors
# the upstream `0.4.0-dev`. Drop the suffix once the dependency is a crates.io
# version or a pinned `rev`.
version = "0.4.0-dev"

[package]
name = "rustuyabridge"
version.workspace = true
edition = "2024"
license = "MIT"
description = "An MQTT bridge for managing Tuya devices via the Tuya Local API."
repository = "https://github.com/3735943886/rustuya-bridge"
readme = "README.md"
keywords = ["tuya", "mqtt", "iot", "bridge", "smart-home"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3"
log = "0.4"
# 0.4 is the sans-I/O redesign: a `rustuya-core` FSM plus the `rustuya-tokio`
# driver, living on the `0.4-sansio` branch. Neither crate is published yet, so
# the dependency is taken straight from git; Cargo.lock pins the exact rev, and
# this should become a `rev = "..."` (or a crates.io version) before release.
rustuya-tokio = { git = "https://github.com/3735943886/rustuya", branch = "feat/bridge-driver-hooks" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
# StreamMap/WatchStream: the device listener fans every device's frame stream and
# connection-state watch into one loop with no task per device.
tokio-stream = { version = "0.1", features = ["sync"] }
# Raises the process fd limit (one socket per device). 0.3 did this inside the
# library; setting a process rlimit is the application's call, so it lives here now.
rlimit = "0.10"
rumqttc = { version = "0.25", features = ["use-rustls"] }
bytes = "1.0"
regex = "1.11"
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["python"]
# A bare `cargo build`/`test` at the root builds only the bridge — the python
# crate is a PyO3 extension (needs python headers) and is built via maturin, not
# cargo. `python` stays a member purely to inherit [workspace.package].version.
# The Dockerfile relies on this: it builds the workspace but must not try to
# compile the extension (it copies python/ only so the workspace manifest loads).
default-members = ["."]

# Single source of truth for the version, inherited by both the bridge crate
# and the pyrustuyabridge wheel via `version.workspace = true`. The PyPI
# package follows automatically (pyproject `dynamic = ["version"]` → maturin).
[workspace.package]
# `-dev` while `rustuya` upstream is still beta (0.4.0-beta.3 as of this
# writing, now a crates.io dependency rather than git). Revisit this suffix
# once upstream cuts a stable 0.4.0.
version = "0.4.0-dev.1"

[package]
name = "rustuyabridge"
version.workspace = true
edition = "2024"
license = "MIT"
description = "An MQTT bridge for managing Tuya devices via the Tuya Local API."
repository = "https://github.com/3735943886/rustuya-bridge"
readme = "README.md"
keywords = ["tuya", "mqtt", "iot", "bridge", "smart-home"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3"
log = "0.4"
# 0.4 is the sans-I/O redesign: a core FSM plus a tokio driver, now published
# as a single `rustuya` crate with the driver behind the `tokio` feature.
rustuya = { version = "0.4.0-beta.3", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
# StreamMap/WatchStream: the device listener fans every device's frame stream and
# connection-state watch into one loop with no task per device.
tokio-stream = { version = "0.1", features = ["sync"] }
# Raises the process fd limit (one socket per device). 0.3 did this inside the
# library; setting a process rlimit is the application's call, so it lives here now.
rlimit = "0.10"
rumqttc = { version = "0.25", features = ["use-rustls"] }
bytes = "1.0"
regex = "1.11"
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
